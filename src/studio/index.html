<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebTAPP Mac</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181c27;
      --card-border: #262c3d;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #11141e;
      --input-border: #2a334a;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Window Drag Header */
    .titlebar {
      height: 38px;
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 40px 20px;
      flex: 1;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9999px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Preset Grid */
    .presets-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .preset-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 8px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 12px;
      font-weight: 500;
    }

    .preset-btn:hover {
      border-color: var(--accent);
      background: #1f2536;
      transform: translateY(-2px);
    }

    .preset-icon {
      font-size: 20px;
    }

    /* Main Form */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="url"],
    input[type="number"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text);
      user-select: text;
      transition: border-color 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* File picker field */
    .icon-input-row {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: #262c3d;
      border: 1px solid #3b445c;
      color: #e5e7eb;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .icon-btn:hover {
      background: #323a4f;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: normal;
      color: #9ca3af;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    .submit-btn:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    /* Result Box */
    #result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      display: none;
      font-size: 13px;
      line-height: 1.6;
    }

    #result-box.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    #result-box.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .action-btn-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      background: #10b981;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #059669;
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid #ffffff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="titlebar">WebTAPP Mac</div>

  <div class="container">
    <header>
      <div class="badge">Chromium Powered</div>
      <h1>WebTAPP Mac</h1>
      <p class="subtitle">Webサービスを高速に独立したmacOSネイティブアプリ（.app）に変換</p>
    </header>

    <div class="presets-title">クイックプリセット</div>
    <div class="presets-grid">
      <button class="preset-btn" onclick="selectPreset('Google Notebook', 'https://notebooklm.google.com')">
        <span class="preset-icon">📔</span>
        <span>Notebook</span>
      </button>
      <button class="preset-btn" onclick="selectPreset('Messenger', 'https://www.messenger.com')">
        <span class="preset-icon">💬</span>
        <span>Messenger</span>
      </button>
      <button class="preset-btn" onclick="selectPreset('note', 'https://note.com')">
        <span class="preset-icon">📝</span>
        <span>note</span>
      </button>
      <button class="preset-btn" onclick="selectPreset('ChatGPT', 'https://chatgpt.com')">
        <span class="preset-icon">🤖</span>
        <span>ChatGPT</span>
      </button>
      <button class="preset-btn" onclick="selectPreset('Claude', 'https://claude.ai')">
        <span class="preset-icon">🧠</span>
        <span>Claude</span>
      </button>
      <button class="preset-btn" onclick="selectPreset('Notion', 'https://www.notion.so')">
        <span class="preset-icon">📄</span>
        <span>Notion</span>
      </button>
      <button class="preset-btn" onclick="selectPreset('Discord', 'https://discord.com/app')">
        <span class="preset-icon">🎮</span>
        <span>Discord</span>
      </button>
      <button class="preset-btn" onclick="selectPreset('YouTube Music', 'https://music.youtube.com')">
        <span class="preset-icon">🎵</span>
        <span>YT Music</span>
      </button>
    </div>

    <div class="form-card">
      <form id="app-form" onsubmit="handleBuild(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="name">アプリ名</label>
            <input type="text" id="name" placeholder="例: Google Notebook" required>
          </div>
          <div class="form-group">
            <label for="bundleId">Bundle ID (任意)</label>
            <input type="text" id="bundleId" placeholder="自動生成 (例: com.webtoapp.googlenotebook)">
          </div>
        </div>

        <div class="form-group">
          <label for="url">WebサイトのURL</label>
          <input type="url" id="url" placeholder="https://notebooklm.google.com" required>
        </div>

        <div class="form-group">
          <label for="icon">カスタムアイコン画像 (任意 / 省略時はWebから自動抽出)</label>
          <div class="icon-input-row">
            <input type="text" id="icon" placeholder="空欄でWebアイコン自動取得 または 画像を選択">
            <button type="button" class="icon-btn" onclick="browseIcon()">ファイル選択...</button>
          </div>
        </div>

        <div class="options-grid">
          <label class="checkbox-label">
            <input type="checkbox" id="install" checked>
            ~/Applications に直接インストール
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="hiddenTitlebar">
            モダンな枠なしタイトルバー (Full View)
          </label>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">
          <span>🚀 独立Macアプリ（.app）を作成</span>
        </button>
      </form>

      <div id="result-box"></div>
    </div>
  </div>

  <script>
    let lastGeneratedAppPath = null;

    function selectPreset(name, url) {
      document.getElementById('name').value = name;
      document.getElementById('url').value = url;
      document.getElementById('bundleId').value = '';
      document.getElementById('icon').value = '';
    }

    async function browseIcon() {
      if (window.electronAPI && window.electronAPI.selectIconFile) {
        const filePath = await window.electronAPI.selectIconFile();
        if (filePath) {
          document.getElementById('icon').value = filePath;
        }
      }
    }

    async function handleBuild(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const resultBox = document.getElementById('result-box');

      const params = {
        name: document.getElementById('name').value.trim(),
        url: document.getElementById('url').value.trim(),
        bundle_id: document.getElementById('bundleId').value.trim() || null,
        icon: document.getElementById('icon').value.trim() || null,
        install: document.getElementById('install').checked,
        hidden_titlebar: document.getElementById('hiddenTitlebar').checked
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> <span>アプリを生成中... (Chromiumランタイム構築)</span>';
      resultBox.style.display = 'none';

      try {
        let result;
        if (window.electronAPI && window.electronAPI.buildApp) {
          result = await window.electronAPI.buildApp(params);
        } else {
          // Fallback to fetch API if opened in browser
          const res = await fetch('/api/build', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(params)
          });
          result = await res.json();
        }

        if (result && result.success) {
          lastGeneratedAppPath = result.path;
          resultBox.className = 'success';
          resultBox.innerHTML = `
            <strong>🎉 アプリが完成しました！</strong><br>
            場所: <code>${result.path}</code><br>
            <div class="action-btn-row">
              <button class="btn-secondary" onclick="openFinder()">📁 Finderで表示</button>
            </div>
          `;
          resultBox.style.display = 'block';
        } else {
          resultBox.className = 'error';
          resultBox.innerHTML = `<strong>エラー:</strong> ${result.error || '作成に失敗しました'}`;
          resultBox.style.display = 'block';
        }
      } catch (err) {
        resultBox.className = 'error';
        resultBox.innerHTML = `<strong>エラー:</strong> ${err.message}`;
        resultBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>🚀 独立Macアプリ（.app）を作成</span>';
      }
    }

    function openFinder() {
      if (lastGeneratedAppPath && window.electronAPI && window.electronAPI.showInFinder) {
        window.electronAPI.showInFinder(lastGeneratedAppPath);
      }
    }
  </script>
</body>
</html>
